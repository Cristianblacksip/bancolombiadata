<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reporte de Indexación VTEX — Bancolombia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1a1d23; --muted: #6b7280;
    --border: #e5e7eb; --accent: #2563eb; --danger: #dc2626; --ok: #16a34a; --warn: #b45309;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 24px 32px; background: var(--card); border-bottom: 1px solid var(--border); }
  header h1 { margin: 0 0 4px; font-size: 20px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  h2.section { margin: 28px 32px 12px; font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .kpis { display: flex; gap: 16px; padding: 20px 32px 0; flex-wrap: wrap; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; min-width: 160px; flex: 1; }
  .kpi .num { font-size: 26px; font-weight: 700; }
  .kpi .label { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .kpi.danger .num { color: var(--danger); }
  .kpi.ok .num { color: var(--ok); }
  .kpi.warn .num { color: var(--warn); }
  .controls { padding: 0 32px 12px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .controls input, .controls select {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px;
  }
  .controls input { flex: 1; min-width: 220px; }
  .table-wrap { margin: 0 32px 32px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: auto; max-height: 60vh; }
  .table-wrap.small { max-height: 40vh; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--card); cursor: pointer; user-select: none; }
  th:hover { background: #f0f1f3; }
  tr:hover td { background: #fafbfc; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.no-indexado { background: #fee2e2; color: var(--danger); }
  .badge.catalogo { background: #dbeafe; color: var(--accent); }
  .badge.oferta { background: #fef3c7; color: #92400e; }
  .pager { display: flex; gap: 8px; align-items: center; padding: 12px 32px 32px; font-size: 13px; color: var(--muted); }
  .pager button { padding: 6px 12px; border: 1px solid var(--border); background: var(--card); border-radius: 6px; cursor: pointer; }
  .pager button:disabled { opacity: .4; cursor: default; }
  .updated { font-size: 12px; color: var(--muted); padding: 0 32px; }
</style>
</head>
<body>

<header>
  <h1>Reporte de Indexación — Productos y SKUs VTEX</h1>
  <p id="fuenteInfo">Cargando…</p>
</header>

<div class="kpis" id="kpis"></div>
<p class="updated" id="updatedAt"></p>

<h2 class="section">Productos por línea y aliado</h2>
<div class="controls">
  <select id="filtroLineaDesglose"><option value="">Todas las líneas</option></select>
</div>
<div class="table-wrap small">
  <table id="tablaDesglose">
    <thead>
      <tr>
        <th data-key="linea">Línea</th>
        <th data-key="aliado">Aliado</th>
        <th data-key="total">Total productos</th>
        <th data-key="no_actualizados">No actualizados</th>
      </tr>
    </thead>
    <tbody id="tbodyDesglose"></tbody>
  </table>
</div>

<h2 class="section">Detalle de productos</h2>
<div class="controls">
  <input type="text" id="buscar" placeholder="Buscar por nombre o ID de producto…">
  <select id="filtroEstado">
    <option value="">Todos los estados</option>
    <option value="No indexado">No indexado</option>
    <option value="Catálogo">Catálogo</option>
    <option value="Oferta comercial (precio/stock)">Oferta comercial</option>
  </select>
  <select id="filtroLinea"><option value="">Todas las líneas</option></select>
  <select id="filtroAliado"><option value="">Todos los aliados</option></select>
</div>

<div class="table-wrap">
  <table id="tabla">
    <thead>
      <tr>
        <th data-key="product_id">ID</th>
        <th data-key="product_name">Nombre</th>
        <th data-key="linea">Línea</th>
        <th data-key="aliado">Aliado</th>
        <th data-key="que_se_actualizo">Estado</th>
        <th data-key="fecha_ultima_actualizacion">Última actualización</th>
        <th data-key="dias_desde_ultima_actualizacion">Días</th>
        <th data-key="is_active">Activo</th>
        <th data-key="is_visible">Visible</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="pager">
  <button id="prevPage">← Anterior</button>
  <span id="pageInfo"></span>
  <button id="nextPage">Siguiente →</button>
</div>

<script>
let allRows = [];
let filtered = [];
let desgloseData = [];
let sortKey = null, sortDir = 1;
let sortKeyDesglose = 'total', sortDirDesglose = -1;
let page = 0;
const PAGE_SIZE = 50;

fetch('data.json')
  .then(r => r.json())
  .then(payload => {
    allRows = payload.rows || [];
    desgloseData = payload.desglose || [];
    filtered = allRows;

    document.getElementById('fuenteInfo').textContent =
      `${allRows.length.toLocaleString('es-CO')} productos — bancolombia.vtex_producto_actualizacion_inmoviliario`;
    document.getElementById('updatedAt').textContent =
      'Última actualización de datos: ' + (payload.meta?.generado_el || '—');

    renderKpis(payload.meta);
    poblarSelectores();
    renderDesglose();
    render();
  })
  .catch(err => {
    document.getElementById('fuenteInfo').textContent = 'Error cargando data.json: ' + err;
  });

function renderKpis(meta) {
  if (!meta) return;
  const kpis = document.getElementById('kpis');
  const fmt = n => (n ?? '—').toLocaleString ? n.toLocaleString('es-CO') : n;
  kpis.innerHTML = `
    <div class="kpi"><div class="num">${fmt(meta.total_productos)}</div><div class="label">Productos totales</div></div>
    <div class="kpi ok"><div class="num">${fmt(meta.actualizados)}</div><div class="label">Actualizados (${meta.porcentaje_indexado ?? '—'}%)</div></div>
    <div class="kpi danger"><div class="num">${fmt(meta.no_actualizados)}</div><div class="label">No actualizados / no indexados</div></div>
    <div class="kpi"><div class="num">${fmt(meta.numero_aliados)}</div><div class="label">Aliados distintos</div></div>
    <div class="kpi"><div class="num">${fmt(meta.numero_lineas)}</div><div class="label">Líneas distintas</div></div>
    <div class="kpi warn"><div class="num">${fmt(meta.actualizados_menos_8_dias)}</div><div class="label">Actualizados hace &lt;8 días</div></div>
    <div class="kpi"><div class="num">${meta.top_aliado_nombre ?? '—'}</div><div class="label">Aliado con más productos (${fmt(meta.top_aliado_total)})</div></div>
  `;
}

function poblarSelectores() {
  const lineas = [...new Set(allRows.map(r => r.linea).filter(Boolean))].sort();
  const aliados = [...new Set(allRows.map(r => r.aliado).filter(Boolean))].sort();

  const selLinea = document.getElementById('filtroLinea');
  const selLineaDesglose = document.getElementById('filtroLineaDesglose');
  const selAliado = document.getElementById('filtroAliado');

  lineas.forEach(l => {
    selLinea.insertAdjacentHTML('beforeend', `<option value="${l}">${l}</option>`);
    selLineaDesglose.insertAdjacentHTML('beforeend', `<option value="${l}">${l}</option>`);
  });
  aliados.forEach(a => selAliado.insertAdjacentHTML('beforeend', `<option value="${a}">${a}</option>`));
}

function applyFilters() {
  const q = document.getElementById('buscar').value.trim().toLowerCase();
  const estado = document.getElementById('filtroEstado').value;
  const linea = document.getElementById('filtroLinea').value;
  const aliado = document.getElementById('filtroAliado').value;

  filtered = allRows.filter(r => {
    const matchQ = !q || (r.product_name || '').toLowerCase().includes(q) || String(r.product_id).includes(q);
    const matchEstado = !estado || r.que_se_actualizo === estado;
    const matchLinea = !linea || r.linea === linea;
    const matchAliado = !aliado || r.aliado === aliado;
    return matchQ && matchEstado && matchLinea && matchAliado;
  });
  page = 0;
  render();
}

document.getElementById('buscar').addEventListener('input', applyFilters);
document.getElementById('filtroEstado').addEventListener('change', applyFilters);
document.getElementById('filtroLinea').addEventListener('change', applyFilters);
document.getElementById('filtroAliado').addEventListener('change', applyFilters);
document.getElementById('filtroLineaDesglose').addEventListener('change', renderDesglose);

document.querySelectorAll('#tabla th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    sortDir = (sortKey === key) ? -sortDir : 1;
    sortKey = key;
    filtered.sort((a, b) => {
      const va = a[key] ?? '', vb = b[key] ?? '';
      if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * sortDir;
      return String(va).localeCompare(String(vb)) * sortDir;
    });
    render();
  });
});

document.querySelectorAll('#tablaDesglose th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    sortDirDesglose = (sortKeyDesglose === key) ? -sortDirDesglose : 1;
    sortKeyDesglose = key;
    renderDesglose();
  });
});

document.getElementById('prevPage').addEventListener('click', () => { if (page > 0) { page--; render(); } });
document.getElementById('nextPage').addEventListener('click', () => {
  if ((page + 1) * PAGE_SIZE < filtered.length) { page++; render(); }
});

function badge(estado) {
  if (estado === 'No indexado') return `<span class="badge no-indexado">No indexado</span>`;
  if (estado === 'Catálogo') return `<span class="badge catalogo">Catálogo</span>`;
  if (estado === 'Oferta comercial (precio/stock)') return `<span class="badge oferta">Oferta</span>`;
  return estado || '—';
}

function renderDesglose() {
  const filtroLinea = document.getElementById('filtroLineaDesglose').value;
  let data = filtroLinea ? desgloseData.filter(d => d.linea === filtroLinea) : desgloseData;

  data = [...data].sort((a, b) => {
    const va = a[sortKeyDesglose], vb = b[sortKeyDesglose];
    if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * sortDirDesglose;
    return String(va).localeCompare(String(vb)) * sortDirDesglose;
  });

  document.getElementById('tbodyDesglose').innerHTML = data.map(d => `
    <tr>
      <td>${d.linea}</td>
      <td>${d.aliado}</td>
      <td>${d.total.toLocaleString('es-CO')}</td>
      <td>${d.no_actualizados.toLocaleString('es-CO')}</td>
    </tr>
  `).join('');
}

function render() {
  const tbody = document.getElementById('tbody');
  const start = page * PAGE_SIZE;
  const pageRows = filtered.slice(start, start + PAGE_SIZE);

  tbody.innerHTML = pageRows.map(r => `
    <tr>
      <td>${r.product_id ?? ''}</td>
      <td>${r.product_name ?? '—'}</td>
      <td>${r.linea ?? '—'}</td>
      <td>${r.aliado ?? '—'}</td>
      <td>${badge(r.que_se_actualizo)}</td>
      <td>${r.fecha_ultima_actualizacion ?? '—'}</td>
      <td>${r.dias_desde_ultima_actualizacion ?? '—'}</td>
      <td>${r.is_active === 1 ? 'Sí' : (r.is_active === 0 ? 'No' : '—')}</td>
      <td>${r.is_visible === 1 ? 'Sí' : (r.is_visible === 0 ? 'No' : '—')}</td>
    </tr>
  `).join('');

  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  document.getElementById('pageInfo').textContent = `Página ${page + 1} de ${totalPages} — ${filtered.length.toLocaleString('es-CO')} resultados`;
  document.getElementById('prevPage').disabled = page === 0;
  document.getElementById('nextPage').disabled = (page + 1) >= totalPages;
}
</script>

</body>
</html>
